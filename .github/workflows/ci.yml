name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      # Scores the rule-based reader against the golden set. The live-model run
      # needs an API key and a network, so it stays a local command; this gate
      # protects the path a reviewer actually gets when they clone the repo.
      - name: Interpretation eval
        run: npm run eval:deterministic

      - name: Build
        run: npm run build
